name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      variant:
        description: "Jenis build: release (cepat, ringan, disarankan) atau debug (lambat, untuk cek error)"
        type: choice
        default: release
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VARIANT: ${{ github.event.inputs.variant || 'release' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Beri izin eksekusi gradlew
        run: chmod +x ./gradlew

      # OPSIONAL: tanda tangan tetap supaya APK baru bisa menimpa APK lama tanpa hapus data.
      # Aktif hanya bila 4 secret (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) sudah dibuat di Settings > Secrets > Actions.
      - name: Siapkan kunci tanda tangan (jika ada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/komky.jks"
            {
              echo "storeFile=$RUNNER_TEMP/komky.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Memakai kunci tanda tangan tetap."
          else
            echo "Secret kunci tidak ada: memakai kunci debug acak (APK baru tidak bisa menimpa APK lama)."
          fi

      - name: Build APK (${{ env.VARIANT }})
        run: |
          if [ "$VARIANT" = "debug" ]; then
            ./gradlew assembleDebug -Parm64-only --no-daemon
          else
            ./gradlew assembleRelease -Parm64-only --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KomKy-${{ env.VARIANT }}-apk
          path: app/build/outputs/apk/${{ env.VARIANT }}/*.apk
          if-no-files-found: error
